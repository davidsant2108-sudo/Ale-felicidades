<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¡Tengo una sorpresa para ti!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 104, 71, .25), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(206, 17, 38, .25), transparent 25%),
        #061d16;
      color: white;
    }

    /* =========================
       LOBBY
    ========================= */

    .lobby {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        radial-gradient(circle at 20% 20%, rgba(0, 104, 71, .8), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(206, 17, 38, .7), transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, .15), transparent 30%),
        linear-gradient(135deg, #003b2a, #062a22, #7b101f);

      z-index: 10;

      transition:
        opacity 1s ease,
        visibility 1s ease;

      overflow: hidden;
    }

    .lobby::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 45px;

      background:
        repeating-linear-gradient(
          90deg,
          #006847 0 45px,
          #ffffff 45px 90px,
          #ce1126 90px 135px
        );

      clip-path: polygon(
        0 0,
        100% 0,
        100% 70%,
        97% 100%,
        94% 70%,
        91% 100%,
        88% 70%,
        85% 100%,
        82% 70%,
        79% 100%,
        76% 70%,
        73% 100%,
        70% 70%,
        67% 100%,
        64% 70%,
        61% 100%,
        58% 70%,
        55% 100%,
        52% 70%,
        49% 100%,
        46% 70%,
        43% 100%,
        40% 70%,
        37% 100%,
        34% 70%,
        31% 100%,
        28% 70%,
        25% 100%,
        22% 70%,
        19% 100%,
        16% 70%,
        13% 100%,
        10% 70%,
        7% 100%,
        4% 70%,
        0 100%
      );

      box-shadow: 0 5px 20px rgba(0, 0, 0, .35);
    }

    .lobby::after {
      content: "🇲🇽 ✦ 🇲🇽 ✦ 🇲🇽 ✦ 🇲🇽";
      position: absolute;
      bottom: 35px;

      width: 100%;

      font-size: clamp(1.2rem, 4vw, 2rem);

      letter-spacing: 10px;

      opacity: .7;

      animation: floating 4s ease-in-out infinite;
    }

    .lobby.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .lobby-content {
      position: relative;

      width: 90%;
      max-width: 600px;

      padding: 45px 30px;

      background: rgba(0, 0, 0, .22);

      border: 1px solid rgba(255, 255, 255, .25);

      border-radius: 30px;

      backdrop-filter: blur(12px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, .45),
        inset 0 0 30px rgba(255, 255, 255, .05);

      animation: floating 3s ease-in-out infinite;

      z-index: 2;
    }

    .lobby-content::before {
      content: "✦ ¡VIVA MÉXICO! ✦";

      position: absolute;

      top: -18px;
      left: 50%;

      transform: translateX(-50%);

      padding: 8px 20px;

      white-space: nowrap;

      background: linear-gradient(
        90deg,
        #006847,
        #ffffff,
        #ce1126
      );

      color: #111;

      font-weight: bold;

      border-radius: 50px;

      box-shadow: 0 8px 25px rgba(0, 0, 0, .3);
    }

    .cake {
      font-size: 85px;

      margin-bottom: 20px;

      animation: bounce 2s infinite;
    }

    .lobby h1 {
      font-size: clamp(2rem, 8vw, 4rem);

      margin-bottom: 15px;

      text-shadow:
        3px 3px 0 #006847,
        -3px -3px 0 #ce1126,
        0 0 20px rgba(255, 255, 255, .3);
    }

    .lobby p {
      font-size: 1.1rem;

      color: #f5f5f5;

      margin-bottom: 35px;

      line-height: 1.6;
    }

    .open-button {
      display: inline-block;

      border: none;

      padding: 17px 35px;

      border-radius: 50px;

      font-size: 1.1rem;

      font-weight: bold;

      color: white;

      cursor: pointer;

      text-decoration: none;

      background:
        linear-gradient(
          90deg,
          #006847 0%,
          #006847 33%,
          #ffffff 33%,
          #ffffff 66%,
          #ce1126 66%
        );

      color: #111;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, .35),
        0 0 25px rgba(255, 255, 255, .2);

      transition:
        transform .25s,
        box-shadow .25s;
    }

    .open-button:hover {
      transform: scale(1.08);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, .5),
        0 0 35px rgba(255, 255, 255, .35);
    }

    .open-button a {
      color: #111;

      text-decoration: none;
    }


    /* =========================
       CONTENIDO PRINCIPAL
    ========================= */

    .main {
      min-height: 100vh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding: 80px 15px 60px;

      position: relative;

      overflow: hidden;

      background:
        radial-gradient(circle at 10% 10%, rgba(0, 104, 71, .45), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(206, 17, 38, .4), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255, 255, 255, .08), transparent 30%),
        linear-gradient(135deg, #032b20, #101010, #6e0d1b);

      opacity: 0;

      transform: scale(1.05);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    .main::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 50px;

      background:
        repeating-linear-gradient(
          90deg,
          #006847 0 45px,
          #ffffff 45px 90px,
          #ce1126 90px 135px
        );

      clip-path: polygon(
        0 0,
        100% 0,
        100% 70%,
        97% 100%,
        94% 70%,
        91% 100%,
        88% 70%,
        85% 100%,
        82% 70%,
        79% 100%,
        76% 70%,
        73% 100%,
        70% 70%,
        67% 100%,
        64% 70%,
        61% 100%,
        58% 70%,
        55% 100%,
        52% 70%,
        49% 100%,
        46% 70%,
        43% 100%,
        40% 70%,
        37% 100%,
        34% 70%,
        31% 100%,
        28% 70%,
        25% 100%,
        22% 70%,
        19% 100%,
        16% 70%,
        13% 100%,
        10% 70%,
        7% 100%,
        4% 70%,
        0 100%
      );

      z-index: 5;
    }

    .main.show {
      opacity: 1;

      transform: scale(1);
    }

    .card {
      position: relative;

      width: 100%;
      max-width: 700px;

      padding: 45px 30px;

      text-align: center;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(0, 104, 71, .18),
          rgba(255, 255, 255, .1),
          rgba(206, 17, 38, .18)
        );

      border: 1px solid rgba(255, 255, 255, .25);

      backdrop-filter: blur(15px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .45),
        inset 0 0 35px rgba(255, 255, 255, .04);

      z-index: 2;
    }

    .card::before {
      content: "🇲🇽 ✦ FIESTAS PATRIAS ✦ 🇲🇽";

      display: block;

      margin-bottom: 25px;

      font-weight: bold;

      letter-spacing: 2px;

      color: #ffd166;

      text-shadow: 0 0 15px rgba(255, 209, 102, .4);
    }

    .card .emoji {
      font-size: 70px;

      margin-bottom: 15px;

      animation: bounce 2s infinite;
    }

    .card h2 {
      font-size: clamp(2.2rem, 9vw, 4.5rem);

      margin-bottom: 10px;

      background:
        linear-gradient(
          90deg,
          #00a86b,
          #ffffff,
          #e63946
        );

      -webkit-background-clip: text;

      color: transparent;

      text-shadow: 0 0 25px rgba(255, 255, 255, .15);
    }

    .card h3 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);

      color: #ffd166;

      margin-bottom: 25px;

      text-shadow:
        0 0 15px rgba(255, 209, 102, .4);
    }

    .message {
      font-size: 1.15rem;

      line-height: 1.8;

      color: #f5f5f5;

      white-space: pre-line;
    }

    .complent-frame {
      display: block;

      width: 100%;

      height: 1200px;

      border: 3px solid rgba(255, 255, 255, .35);

      border-radius: 15px;

      margin: 30px 0;

      background: white;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, .4);
    }

    .signature {
      margin-top: 30px;

      font-size: 1.1rem;

      color: #ffd166;

      text-shadow:
        0 0 10px rgba(255, 209, 102, .3);
    }


    /* =========================
       DECORACIONES FLOTANTES
    ========================= */

    .balloon {
      position: fixed;

      bottom: -150px;

      font-size: 55px;

      animation: rise linear infinite;

      opacity: .9;

      z-index: 1;

      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, .3));
    }

    .b1 {
      left: 8%;

      animation-duration: 9s;

      animation-delay: 1s;
    }

    .b2 {
      left: 30%;

      animation-duration: 12s;
    }

    .b3 {
      left: 60%;

      animation-duration: 10s;

      animation-delay: 3s;
    }

    .b4 {
      left: 82%;

      animation-duration: 13s;

      animation-delay: 2s;
    }


    /* =========================
       CONFETI
    ========================= */

    .confetti {
      position: fixed;

      width: 9px;
      height: 15px;

      top: -30px;

      z-index: 20;

      animation: fall linear forwards;
    }


    /* =========================
       ANIMACIONES
    ========================= */

    @keyframes floating {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-15px) rotate(3deg);
      }
    }

    @keyframes rise {
      from {
        transform: translateY(0) rotate(0deg);
      }

      to {
        transform: translateY(-120vh) rotate(20deg);
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 500px) {

      .card {
        padding: 35px 20px;
      }

      .message {
        font-size: 1rem;

        line-height: 1.7;
      }

      .cake {
        font-size: 70px;
      }

      .lobby-content {
        padding: 40px 20px;
      }

      .complent-frame {
        height: 1200px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       LOBBY
  ========================= -->

  <section class="lobby" id="lobby">

    <div class="lobby-content">

      <div class="cake">🇲🇽</div>

      <h1>¡Tengo una sorpresa para ti!</h1>

      <p>
        Hay algo que preparé especialmente para ti...
        <br>
        ¡Una sorpresa muy mexicana! 🎉
      </p>

      <button class="open-button" onclick="openSurprise()">

        <a href="SNE_SOLICITUD_DE_EMPLEO_PLANTILLA_PDF_copia.pdf"
           download="SNE_SOLICITUD_DE_EMPLEO_PLANTILLA_PDF_copia.pdf">

          ✨ Abrir sorpresa 🇲🇽

        </a>

      </button>

    </div>

  </section>


  <!-- =========================
       PÁGINA PRINCIPAL
  ========================= -->

  <main class="main" id="main">

    <!-- Decoraciones flotantes -->

    <div class="balloon b1">🇲🇽</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🇲🇽</div>
    <div class="balloon b4">🎉</div>


    <div class="card">

      <div class="emoji">🎆</div>

      <h2>¡Feliz cumpleaños!</h2>

      <h3 id="nombre">Alejandro</h3>


      <!--
      <p class="message" id="mensaje">

        Espero que tengas un día increíble,
        lleno de momentos bonitos, risas
        y personas que te aprecian.

      </p>
      -->


      <iframe
        class="complent-frame"
        src="sat.html"
        frameborder="0">
      </iframe>


      <p class="signature">
        ¡Que viva México y que viva tu cumpleaños! 🇲🇽🎉
      </p>

    </div>

  </main>


  <script>

    /* =================================
       PERSONALIZA ESTAS DOS PARTES
    ================================= */

    const nombre = "Alejandro";

    const mensaje = `
Espero que tengas un día increíble,
lleno de momentos bonitos, risas
y personas que te aprecian.

Que este nuevo año de tu vida
venga acompañado de muchas cosas
buenas y momentos inolvidables.

¡Disfruta muchísimo tu día! 🎂✨
`;


    /* =================================
       NO NECESITAS MODIFICAR DESDE AQUÍ
    ================================= */

    document.getElementById("nombre").textContent = nombre;

    // Se mantiene la mecánica original
    const mensajeElemento = document.getElementById("mensaje");

    if (mensajeElemento) {
      mensajeElemento.textContent = mensaje;
    }


    function openSurprise() {

      const lobby = document.getElementById("lobby");

      const main = document.getElementById("main");


      lobby.classList.add("hidden");


      setTimeout(() => {

        main.classList.add("show");

        createConfetti();

      }, 500);

    }


    function createConfetti() {

      const symbols = [
        "🇲🇽",
        "🎉",
        "✨",
        "🎊",
        "⭐",
        "💚",
        "🤍",
        "❤️",
        "🎆",
        "🌟"
      ];


      for (let i = 0; i < 80; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");


        confetti.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];


        confetti.style.left =
          Math.random() * 100 + "vw";


        confetti.style.fontSize =
          (Math.random() * 15 + 10) + "px";


        confetti.style.animationDuration =
          (Math.random() * 3 + 3) + "s";


        confetti.style.animationDelay =
          Math.random() * 2 + "s";


        document.body.appendChild(confetti);


        setTimeout(() => {

          confetti.remove();

        }, 7000);

      }

    }

  </script>

</body>

</html>
